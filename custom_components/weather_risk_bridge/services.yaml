resolve_location:
  name: Resolve location
  description: >-
    Search for a place by name and get coordinate candidates. Returns a
    locations list with label, latitude, longitude, and country code.
  fields:
    query:
      name: Query
      description: Place to search for, e.g. "Austin TX" or "90210".
      required: true
      example: Austin TX
      selector:
        text:

update_location:
  name: Update location
  description: >-
    Update the coordinates (and optionally the label) of an existing Weather
    Risk Suite location without opening its options flow. The location reloads
    automatically once updated. Supply coordinates directly, adopt the Home
    Assistant location, or resolve a place-name query.
  fields:
    location:
      name: Location
      description: >-
        Location key or label (e.g. home). Optional when exactly one Weather
        Risk Suite location is configured.
      required: false
      example: home
      selector:
        text:
    entry_id:
      name: Config entry ID
      description: Exact config entry ID of the location (alternative to location).
      required: false
      selector:
        text:
    latitude:
      name: Latitude
      description: New latitude in decimal degrees.
      required: false
      selector:
        number:
          min: -90
          max: 90
          step: 0.0001
          unit_of_measurement: "\u00B0"
    longitude:
      name: Longitude
      description: New longitude in decimal degrees (west is negative).
      required: false
      selector:
        number:
          min: -180
          max: 180
          step: 0.0001
          unit_of_measurement: "\u00B0"
    use_home_assistant:
      name: Use Home Assistant location
      description: Adopt the coordinates configured in Home Assistant.
      required: false
      selector:
        boolean:
    query:
      name: Search query
      description: >-
        Place name to resolve (e.g. "Austin TX"). When several matches come
        back, pick one with result (1-based).
      required: false
      example: Austin TX
      selector:
        text:
    result:
      name: Search result
      description: Which search match to use when a query returns several (1-based).
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 8
          mode: box
    label:
      name: Label
      description: >-
        New friendly label. Renaming changes the entity names for the location.
      required: false
      selector:
        text:
